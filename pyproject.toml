[build-system]
requires = ["setuptools>=77", "numpy>=2.3.3,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoa-py"
version = "0.1.0a5"
dynamic = ["scripts"]
description = "Native Apple platform modules for Python"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE", "native/physics/box2d/LICENSE"]
authors = [{name = "Yosorable"}]
keywords = ["apple", "macos", "coreml", "native", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Objective C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
coreml = ["numpy>=2.3.3,<3"]
images = ["Pillow"]

[project.urls]
Source = "https://github.com/Yosorable/cocoa-py"
Issues = "https://github.com/Yosorable/cocoa-py/issues"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
scene = ["_resources/*.metal", "_resources/*.metallib"]
_cocoa = ["_runner", "*.xcprivacy"]
